db.doc('videos/'+v.id).update({views:FV.increment(1)}).catch(()=>{});
if(v.paid)return paidFlow(v);
showMedia(v.url);dlStart(v,pv(v.url))}

function paidFlow(v){
const stg=$('#stg'),box=$('#dl'),bg=v.thumb||v.thumbAuto;
function lockV(){
stg.innerHTML=(bg?`<img referrerpolicy="no-referrer" src="${esc(bg)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px) brightness(.5)">`:'')+`<div class="lock"><div style="font-size:2.4rem">🔒</div><b style="color:var(--ac)">পেইড ভিডিও</b><div class="cnt">${money(v.price)}</div>`+(U?`<p class="mut sm">আপনার ব্যালেন্স: ${money(P&&P.balance)}</p><button class="btn" id="buy" type="button">🔓 ${money(v.price)} দিয়ে আনলক করুন</button><button class="btn gh" id="addm" type="button">💰 ব্যালেন্স যোগ করুন</button>`:'<p class="mut sm">আনলক করতে লগইন করুন</p><button class="btn" id="lg" type="button">লগইন / অ্যাকাউন্ট</button>')+'</div>';
box.innerHTML='';
const b=$('#buy',stg),l=$('#lg',stg),a=$('#addm',stg);
if(l)l.onclick=authModal;if(a)a.onclick=()=>walletModal('dep');
if(b)b.onclick=()=>{
if(((P&&P.balance)||0)<v.price){toast('ব্যালেন্স কম, আগে ডিপোজিট করুন');return walletModal('dep')}
if(!confirm(money(v.price)+' কেটে ভিডিও আনলক করবেন?'))return;
b.disabled=true;const bt=db.batch();
bt.update(db.doc('users/'+U.uid),{balance:FV.increment(-v.price)});
bt.set(db.doc('purchases/'+U.uid+'_'+v.id),{uid:U.uid,vid:v.id,title:v.title,price:v.price,at:FV.serverTimestamp()});
bt.commit().then(()=>{toast('আনলক হয়েছে ✓ 🎉');unlock()}).catch(()=>{b.disabled=false;toast('কেনা যায়নি, আবার চেষ্টা করুন')})}}
function unlock(){
db.doc('videos/'+v.id+'/private/src').get().then(s=>{const u=s.exists?s.data().url:'';
if(!u){stg.innerHTML='<div class="lock">⚠️ ভিডিও লিংক পাওয়া যায়নি</div>';return}
showMedia(u);const i=pv(u);
box.innerHTML=`<p class="mut sm" style="margin-bottom:8px">আপনি এই ভিডিও কিনেছেন, বিজ্ঞাপন ছাড়াই ডাউনলোড করুন</p><a class="btn" id="dfin" href="${esc(i.d)}" target="_blank" rel="noopener">⬇️ ডাউনলোড করুন</a>`;
$('#dfin').onclick=()=>{db.doc('videos/'+v.id).update({downloads:FV.increment(1)}).catch(()=>{})}}).catch(lockV)}
if(!U)return lockV();
db.doc('purchases/'+U.uid+'_'+v.id).get().then(s=>s.exists?unlock():lockV()).catch(lockV)}

function dlStart(v,i){
const box=$('#dl');
box.innerHTML='<button class="btn" id="dgo" type="button">⬇️ ডাউনলোড করুন</button><p class="mut sm" style="margin-top:8px">ডাউনলোডের আগে একটি বিজ্ঞাপন দেখতে হবে</p>';
$('#dgo').onclick=()=>{
if(S.adLink){try{window.open(S.adLink,'_blank','noopener')}catch(e){}}
let n=+S.seconds||8;
box.innerHTML='<div class="cnt" id="cd">'+bn(n)+'</div><p class="mut">বিজ্ঞাপন দেখুন, ডাউনলোড লিংক আসছে...</p>';
const iv=setInterval(()=>{
if(!box.isConnected){clearInterval(iv);return}
n--;if(n>0){$('#cd').textContent=bn(n);return}
clearInterval(iv);
box.innerHTML=`<a class="btn" id="dfin" href="${esc(i.d)}" target="_blank" rel="noopener">✅ ডাউনলোড শুরু করুন</a>`;
$('#dfin').onclick=()=>{db.doc('videos/'+v.id).update({downloads:FV.increment(1)}).catch(()=>{})}},1000)}}
load();
</script></body></html>
