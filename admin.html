<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#07070b;--c:#12121a;--c2:#181822;--tx:#f4f0e6;--mut:#9a95a8;--ac:#f0c45c;--ac2:#c58a22;--ln:rgba(240,196,92,.22);--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.5}
input,select,textarea,button{font:inherit;color:inherit}
.sh{display:grid;grid-template-columns:170px 1fr;min-height:100vh}
nav{background:var(--c);border-right:1px solid var(--ln);padding:14px 10px}
.lg2{font-weight:800;letter-spacing:2px;color:var(--ac);padding:6px 10px 14px}
nav a{display:block;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut);white-space:nowrap}
nav a.on{background:rgba(240,196,92,.14);color:var(--tx)}
main{padding:18px;max-width:820px;width:100%}
h2{color:var(--ac);margin-bottom:12px}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.c{background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:14px}
.c small{display:block;color:var(--mut);font-size:.78rem}.c b{font-size:1.5rem;color:var(--ac)}
.fm{margin-bottom:14px}
label{display:block;margin-top:10px;font-size:.82rem;color:var(--mut)}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);outline:0;font-size:16px}
input[type=checkbox]{width:auto;margin-left:8px}textarea{min-height:70px}
.b{width:100%;margin-top:14px;border:0;cursor:pointer;padding:12px;border-radius:99px;font-weight:700;color:#1b1406;background:linear-gradient(135deg,#fbe9a8,var(--ac),var(--ac2))}
.li{background:var(--c);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;margin-top:8px}
.t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.mut{color:var(--mut)}.sm{font-size:.82rem}.bad{color:var(--bad)}
.ac{margin-top:8px;display:flex;gap:8px}
.s{border:0;cursor:pointer;padding:6px 14px;border-radius:99px;background:#3b3b4d;color:#fff;font-size:.82rem;font-weight:700}.s.r{background:var(--bad)}
.lg{max-width:360px;margin:12vh auto;padding:24px;background:var(--c);border:1px solid var(--ln);border-radius:18px}.lg h2{text-align:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#14141c;color:var(--ac);border:1px solid var(--ln);padding:10px 20px;border-radius:99px;z-index:9}
@media(max-width:700px){.sh{grid-template-columns:1fr}nav{display:flex;overflow-x:auto}.lg2{display:none}}
</style></head><body>
<div id="app"></div>
<script>
const FB={apiKey:"AIzaSyDsgd2a9Tl75aiWdjdeznidCkS4JuO22NY",authDomain:"aivideofreebd.firebaseapp.com",projectId:"aivideofreebd",storageBucket:"aivideofreebd.firebasestorage.app",messagingSenderId:"1064536851209",appId:"1:1064536851209:web:cdf314feb1894db9ce49d8"};
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function thumbOf(u){const m=String(u).match(/drive\.google\.com.*?(?:\/d\/|[?&]id=)([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w640':''}

function loginView(){
$('#app').innerHTML='<div class="lg"><h2>▶ অ্যাডমিন লগইন</h2><label>ইমেইল<input id="e" type="email"></label><label>পাসওয়ার্ড<input id="p" type="password"></label><button class="b" id="go">লগইন</button><p id="m" class="bad sm" style="margin-top:10px;text-align:center"></p></div>';
$('#go').onclick=()=>auth.signInWithEmailAndPassword($('#e').value.trim(),$('#p').value).catch(()=>$('#m').textContent='ইমেইল বা পাসওয়ার্ড ভুল')}
auth.onAuthStateChanged(u=>u?shell():loginView());

const NAV=[['dash','📊 ড্যাশবোর্ড'],['vid','🎬 ভিডিও'],['dep','⬇️ ডিপোজিট'],['usr','👥 ইউজার'],['set','⚙️ সেটিংস ও অ্যাড'],['out','🚪 লগআউট']];
function shell(){
$('#app').innerHTML='<div class="sh"><nav><div class="lg2">▶ ADMIN</div>'+NAV.map(n=>`<a data-v="${n[0]}">${n[1]}</a>`).join('')+'</nav><main id="mn"></main></div>';
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));go('dash')}
async function go(v){
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
if(v==='out'){auth.signOut();return}
const m=$('#mn');m.onclick=null;m.innerHTML='<p class="mut">লোড হচ্ছে...</p>';
try{await V[v](m)}catch(e){m.innerHTML='<p class="bad">সমস্যা: '+esc(e.code||e.message)+'<br>Firestore Rules ও অ্যাডমিন ইমেইল যাচাই করুন।</p>'}}
const V={};

V.dash=async m=>{
const q=await db.collection('videos').get();let vw=0,dl=0;q.forEach(d=>{const x=d.data();vw+=+x.views||0;dl+=+x.downloads||0});
m.innerHTML=`<h2>📊 ড্যাশবোর্ড</h2><div class="cs"><div class="c"><small>মোট ভিডিও</small><b>${q.size}</b></div><div class="c"><small>মোট ভিউ</small><b>${vw}</b></div><div class="c"><small>মোট ডাউনলোড</small><b>${dl}</b></div></div>`};

V.vid=async m=>{
m.innerHTML=`<h2>🎬 ভিডিও</h2><div class="c fm"><label>টাইটেল<input id="vt"></label><label>ভিডিও লিংক (Google Drive শেয়ার লিংক বা সরাসরি mp4)<input id="vu" type="url"></label>
<label>ধরন<select id="vr"><option value="9/16">Reels / Shorts (9:16)</option><option value="16/9">Long Video (16:9)</option></select></label>
<label>থাম্বনেইল লিংক (ফাঁকা রাখলে Drive-এর অটো)<input id="vth" type="url"></label><label>বিবরণ<textarea id="vd"></textarea></label><label>পেইড ভিডিও? (টিক দিলে পেইড)<input id="vp" type="checkbox"></label><label>দাম (টাকা, শুধু পেইড হলে)<input id="vpr" type="number" inputmode="decimal"></label><button class="b" id="vadd">পোস্ট করুন</button></div><div id="vl"></div>`;
async function list(){
const q=await db.collection('videos').orderBy('createdAt','desc').limit(100).get();
$('#vl').innerHTML=q.docs.map(d=>{const v=d.data();return `<div class="li"><div class="t"><b>${esc(v.title)}</b><span class="mut sm">${v.paid?'🔒 ৳'+v.price:'🆓 ফ্রি'} · 👁 ${v.views||0} · ⬇ ${v.downloads||0}${v.hidden?' · লুকানো':''}</span></div><div class="ac"><button class="s" data-h="${d.id}" data-x="${v.hidden?1:0}">${v.hidden?'দেখান':'লুকান'}</button><button class="s r" data-d="${d.id}">মুছুন</button></div></div>`}).join('')||'<p class="mut">কোনো ভিডিও নেই</p>'}
$('#vadd').onclick=async()=>{
const title=$('#vt').value.trim(),url=$('#vu').value.trim();
if(!title||!url)return toast('টাইটেল ও লিংক দিন');
const paid=$('#vp').checked,price=paid?(parseFloat($('#vpr').value)||0):0;if(paid&&price<=0)return toast('পেইড ভিডিওর দাম দিন');
try{const doc={title,ratio:$('#vr').value,thumb:$('#vth').value.trim(),thumbAuto:thumbOf(url),desc:$('#vd').value.trim(),paid,price,hidden:false,views:0,downloads:0,createdAt:FV.serverTimestamp()};if(!paid)doc.url=url;const ref=await db.collection('videos').add(doc);if(paid)await ref.collection('private').doc('src').set({url});
toast('পোস্ট হয়েছে ✓');['vt','vu','vth','vd','vpr'].forEach(k=>$('#'+k).value='');list()}catch(e){toast('সমস্যা: '+(e.code||e.message))}};
m.onclick=async e=>{
const h=e.target.closest('[data-h]'),d=e.target.closest('[data-d]');
if(h){await db.doc('videos/'+h.dataset.h).update({hidden:h.dataset.x!=='1'});list()}
if(d&&confirm('ভিডিওটি মুছে ফেলবেন?')){await db.doc('videos/'+d.dataset.d+'/private/src').delete().catch(()=>{});await db.doc('videos/'+d.dataset.d).delete();list()}};
list()};

V.dep=async m=>{
const q=await db.collection('deposits').orderBy('at','desc').limit(100).get();
const LB={pending:'অপেক্ষমাণ',approved:'সফল',rejected:'বাতিল'};
m.innerHTML='<h2>⬇️ ডিপোজিট</h2>'+(q.docs.map(d=>{const x=d.data();return `<div class="li"><div class="t"><b>৳${x.amount} · ${esc(x.method)}</b><span class="mut sm">${LB[x.status]||''}</span></div><div class="mut sm">${esc(x.email)} · TrxID: ${esc(x.trx)}</div>`+(x.status==='pending'?`<div class="ac"><button class="s" style="background:var(--ok)" data-a="ok" data-i="${d.id}">✅ অনুমোদন</button><button class="s r" data-a="no" data-i="${d.id}">❌ বাতিল</button></div>`:'')+'</div>'}).join('')||'<p class="mut">কিছু নেই</p>');
m.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;
const ref=db.doc('deposits/'+b.dataset.i),x=(await ref.get()).data();
if(x.status!=='pending')return toast('আগেই হয়ে গেছে');
b.disabled=true;const bt=db.batch();
if(b.dataset.a==='ok'){bt.update(ref,{status:'approved'});bt.update(db.doc('users/'+x.uid),{balance:FV.increment(+x.amount)})}else bt.update(ref,{status:'rejected'});
try{await bt.commit();toast('✓ হয়েছে');go('dep')}catch(er){b.disabled=false;toast('সমস্যা: '+(er.code||er.message))}}};
V.usr=async m=>{
const q=await db.collection('users').limit(200).get();
m.innerHTML='<h2>👥 ইউজার</h2>'+(q.docs.map(d=>{const u=d.data();return `<div class="li"><div class="t"><b>${esc(u.name||u.email)}</b><span>৳${u.balance||0}</span></div><div class="mut sm">${esc(u.email)}</div><div class="ac"><button class="s" data-u="${d.id}">± ব্যালেন্স</button></div></div>`}).join('')||'<p class="mut">কোনো ইউজার নেই</p>');
m.onclick=async e=>{const b=e.target.closest('[data-u]');if(!b)return;
const v=parseFloat(prompt('কত টাকা যোগ করবেন? (বিয়োগ করতে সামনে - দিন)'));if(!v)return;
await db.doc('users/'+b.dataset.u).update({balance:FV.increment(v)});toast('✓ হয়েছে');go('usr')}};

const SF=[['সাইটের নাম','siteName'],['হিরো শিরোনাম','heroTitle'],['হিরো লেখা','heroText'],['ঘোষণা','announce'],['Facebook লিংক','facebook'],['Telegram লিংক','telegram'],['WhatsApp নম্বর','whatsapp'],
['bKash নম্বর','payment.bkash'],['Nagad নম্বর','payment.nagad'],['ন্যূনতম ডিপোজিট','payment.minDeposit','n'],
['ডাউনলোডের আগের অ্যাড লিংক (Monetag/Adsterra Direct Link)','adLink'],['অপেক্ষার সেকেন্ড','seconds','n'],
['ব্যানার অ্যাড চালু','ads.enabled','b'],['উপরের অ্যাড কোড','ads.top','t'],['নিচের অ্যাড কোড','ads.bottom','t'],['ভিডিও পেজের অ্যাড কোড','ads.player','t']];
const gp=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
V.set=async m=>{
const s=(await db.doc('settings/site').get()).data()||{};
m.innerHTML='<h2>⚙️ সেটিংস ও অ্যাড</h2><div class="c fm">'+SF.map((f,i)=>{const v=gp(s,f[1]),t=f[2];
if(t==='b')return `<label>${f[0]}<input type="checkbox" data-i="${i}" ${v?'checked':''}></label>`;
if(t==='t')return `<label>${f[0]}<textarea data-i="${i}">${esc(v||'')}</textarea></label>`;
return `<label>${f[0]}<input data-i="${i}" ${t==='n'?'type="number"':''} value="${esc(v==null?'':v)}"></label>`}).join('')+'<button class="b" id="ss">সেভ করুন</button></div>';
$('#ss').onclick=async()=>{const o={};
SF.forEach((f,i)=>{const el=m.querySelector('[data-i="'+i+'"]');
const v=f[2]==='b'?el.checked:f[2]==='n'?(parseFloat(el.value)||0):el.value.trim();
const k=f[1].split('.');let c=o;k.slice(0,-1).forEach(x=>c=c[x]=c[x]||{});c[k[k.length-1]]=v});
try{await db.doc('settings/site').set(o,{merge:true});toast('সেভ হয়েছে ✓')}catch(e){toast('সমস্যা: '+(e.code||e.message))}}};
</script></body></html>
